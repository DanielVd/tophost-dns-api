[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tophost-dns-api"
version = "0.1.0"
description = "Unofficial Python API for managing Tophost DNS records"
readme = "README.md"
authors = [
    { name = "Daniel Vedovato" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["tophost", "dns", "fastapi", "rest-api"]
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/DanielVd/tophost-dns-api"
Repository = "https://github.com/DanielVd/tophost-dns-api"
Issues = "https://github.com/DanielVd/tophost-dns-api/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "responses>=0.25,<1",
    "ruff>=0.9,<1",
    "httpx2>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real Tophost account/network access",
]

[tool.ruff]
line-length = 88
target-version = "py311"
